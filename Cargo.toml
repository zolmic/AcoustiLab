[workspace]
resolver = "2"
members = ["crates/acoustilab", "crates/acoustilab-cli", "crates/acoustilab-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[profile.release]
debug = false
lto = "thin"
